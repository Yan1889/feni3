events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name feni.yan1.de;

        location /api/ {
            proxy_pass http://feni-api:8080/;
        }

        location / {
            root /var/www/html/;
        }
    }
}
